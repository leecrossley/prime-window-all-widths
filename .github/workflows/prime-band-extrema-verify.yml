name: Verify prime-band-extrema

on:
  push:
    branches: [main]
    paths: ['results/prime-band-extrema/**']
  pull_request:
    paths: ['results/prime-band-extrema/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: results/prime-band-extrema

permissions:
  contents: read

concurrency:
  group: verify-prime-band-extrema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-release.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned arithmetic package
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          if [ -f requirements.txt ]; then "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt; fi
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Certificates
        run: bash verify-release.sh
